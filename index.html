<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#b87400">
  <meta name="description" content="Aali One — leads, deals, quotations, projects, tasks, payments and support in one place.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
  <title>Aali One</title>
  <!-- The look (light or dark) is set before anything is drawn, so the opening screen never flashes the wrong colour. -->
  <script src="/theme.js"></script>
  <!-- The opening screen: the logo, the name and a thin gold line. It is plain HTML and CSS, so it shows at once, even before the app
       has downloaded. When the app is ready, src/App.jsx adds the class "up" and the whole screen slides up and away. -->
  <style>
    #splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#f6f1e6;color:#b87400;font-family:"Archivo",system-ui,"Segoe UI",sans-serif;box-shadow:0 30px 60px -20px rgba(40,28,6,.35);transition:transform .8s cubic-bezier(.76,0,.24,1)}
    [data-theme="dark"] #splash{background:#100e09;color:#e0a52e}
    #splash .in{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:24px;transition:transform .5s cubic-bezier(.76,0,.24,1),opacity .35s}
    #splash img{width:72px;height:72px;border-radius:20px;margin-bottom:10px;box-shadow:0 18px 36px -14px rgba(160,100,0,.75)}
    #splash b{font-family:"Source Serif 4",Georgia,serif;font-size:27px;letter-spacing:-.01em;color:#2b2210}
    #splash span{font-size:14px;color:#655839}
    [data-theme="dark"] #splash b{color:#f4ecd8} [data-theme="dark"] #splash span{color:#c2b591}
    #splash .bar{width:150px;height:4px;margin-top:12px;border-radius:9px;background:rgba(184,116,0,.18);overflow:hidden}
    #splash .bar i{display:block;width:40%;height:100%;border-radius:9px;background:currentColor;animation:sp-bar 1.1s ease-in-out infinite}
    #splash.up{transform:translateY(-102%)}
    #splash.up .in{transform:translateY(-70px);opacity:0}
    @keyframes sp-bar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
    @media (prefers-reduced-motion:reduce){#splash,#splash .in{transition:opacity .3s}#splash.up{transform:none;opacity:0}#splash .bar i{animation:none;width:100%;opacity:.5}}
    @media print{#splash{display:none}}
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Opening Aali One"><div class="in">
    <img src="/icon.svg" alt="">
    <b>Aali One</b><span>Getting your day ready…</span>
    <div class="bar"><i></i></div>
  </div></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
