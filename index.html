<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#b87400">
  <meta name="description" content="Aali One — leads, deals, quotations, projects, tasks, payments and support in one place.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
  <title>Aali One</title>
  <!-- The look (light or dark) is set before anything is drawn, so the opening screen never flashes the wrong colour. -->
  <script src="/theme.js"></script>
  <!-- The opening screen: a cup of chai running late for work, spilling a little, with a different funny line each time (splash.js).
       It is plain HTML and CSS, so it shows at once, even before the app has downloaded. When the app is ready, src/App.jsx adds the
       class "up" and the whole screen slides up and away. -->
  <style>
    #splash{--line:#5b3a00;--cup:#fffdf8;--chai:#c98a3c;position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#f6f1e6;color:#b87400;font-family:"Archivo",system-ui,"Segoe UI",sans-serif;box-shadow:0 30px 60px -20px rgba(40,28,6,.35);transition:transform .8s cubic-bezier(.76,0,.24,1)}
    [data-theme="dark"] #splash{--line:#f4c35c;--cup:#2a2213;--chai:#b9792c;background:#100e09;color:#e0a52e}
    #splash .in{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:24px;transition:transform .5s cubic-bezier(.76,0,.24,1),opacity .35s}
    #splash svg{width:190px;height:auto;overflow:visible;fill:none;stroke:var(--line);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
    #splash b{font-family:"Source Serif 4",Georgia,serif;font-size:27px;letter-spacing:-.01em;color:#2b2210}
    #splash span{font-size:15px;color:#655839;min-height:1.5em}
    [data-theme="dark"] #splash b{color:#f4ecd8} [data-theme="dark"] #splash span{color:#c2b591}
    #splash .cup{animation:sp-bob .3s ease-in-out infinite alternate;transform-origin:80px 104px}
    #splash .leg{animation:sp-leg .6s ease-in-out infinite}
    #splash .leg.b{animation-delay:-.3s}
    #splash .lid{animation:sp-slosh .6s ease-in-out infinite;transform-origin:78px 48px}
    #splash .drop{fill:var(--chai);stroke:none;animation:sp-drop .6s ease-out infinite}
    #splash .drop.b{animation-delay:-.3s}
    #splash .steam{stroke-width:2.6;opacity:.55;animation:sp-steam 1.2s ease-in-out infinite}
    #splash .steam.b{animation-delay:-.6s}
    #splash .eye{fill:var(--line);stroke:none;transform-origin:78px 72px;animation:sp-blink 2.4s infinite}
    #splash .road{stroke:currentColor;stroke-dasharray:16 14;animation:sp-road .36s linear infinite}
    #splash .wind{stroke:currentColor;stroke-width:2.6;stroke-dasharray:12 60;animation:sp-wind .5s linear infinite}
    #splash .shade{fill:currentColor;stroke:none;opacity:.16;transform-origin:78px 126px;animation:sp-shade .3s ease-in-out infinite alternate}
    #splash.up{transform:translateY(-102%)}
    #splash.up .in{transform:translateY(-70px);opacity:0}
    @keyframes sp-bob{from{transform:translateY(0) rotate(7deg)}to{transform:translateY(-7px) rotate(4deg)}}
    @keyframes sp-leg{0%,100%{transform:rotate(42deg)}50%{transform:rotate(-42deg)}}
    @keyframes sp-slosh{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    @keyframes sp-drop{0%{opacity:0;transform:translate(0,0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(-30px,14px) scale(1)}}
    @keyframes sp-steam{0%{opacity:0;transform:translate(0,6px)}40%{opacity:.6}100%{opacity:0;transform:translate(-16px,-12px)}}
    @keyframes sp-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    @keyframes sp-road{to{stroke-dashoffset:30}}
    @keyframes sp-wind{to{stroke-dashoffset:72}}
    @keyframes sp-shade{from{transform:scaleX(1)}to{transform:scaleX(.78)}}
    @media (prefers-reduced-motion:reduce){#splash,#splash .in{transition:opacity .3s}#splash.up{transform:none;opacity:0}#splash svg *{animation:none!important}}
    @media print{#splash{display:none}}
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Opening Aali One"><div class="in">
    <svg viewBox="0 0 160 136" aria-hidden="true">
      <path class="wind" d="M6 62h34M0 80h30M10 98h26"/>
      <ellipse class="shade" cx="78" cy="126" rx="30" ry="4"/>
      <path class="road" d="M4 128h152"/>
      <g class="cup">
        <path class="steam" d="M66 34c-6-6 5-10-1-17"/><path class="steam b" d="M84 32c-6-6 5-10-1-17"/>
        <circle class="drop" cx="46" cy="44" r="3.4"/><circle class="drop b" cx="42" cy="54" r="2.6"/>
        <g class="leg" style="transform-origin:66px 102px"><path d="M66 102v17h9"/></g>
        <g class="leg b" style="transform-origin:90px 102px"><path d="M90 102v17h9"/></g>
        <path d="M110 62c17-1 17 23-3 22"/>
        <path d="M46 48h64l-6 46a12 12 0 0 1-12 10H64a12 12 0 0 1-12-10z" fill="var(--cup)"/>
        <ellipse class="lid" cx="78" cy="48" rx="32" ry="6.5" fill="var(--chai)"/>
        <g class="eye"><circle cx="68" cy="72" r="3.3"/><circle cx="90" cy="72" r="3.3"/></g>
        <path d="M72 82q7 7 14 0"/>
        <circle cx="61" cy="81" r="4" fill="#ef9a8f" stroke="none" opacity=".75"/><circle cx="97" cy="81" r="4" fill="#ef9a8f" stroke="none" opacity=".75"/>
      </g>
    </svg>
    <b>Aali One</b><span id="splash-line">Chai first. Then work.</span>
  </div></div>
  <script src="/splash.js"></script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
